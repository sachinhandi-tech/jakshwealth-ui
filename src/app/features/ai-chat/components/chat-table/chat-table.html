<section class="chat-table">
  @if (title()) {
    <ngui-typography type="h4" class="chat-table__title">{{ title() }}</ngui-typography>
  }

  <div class="chat-table__wrap">
    <table>
      <thead>
        <tr>
          @for (column of columns(); track column.key) {
            <th scope="col">{{ column.label }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track $index) {
          <tr>
            @for (column of columns(); track column.key) {
              <td>{{ cellValue(row, column.key) }}</td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
