<section class="utilization-tab">
  <div
    class="utilization-tab__layout"
    [class.utilization-tab__layout--narrow]="isNarrow()"
    [class.utilization-tab__layout--filters-collapsed]="isFiltersCollapsed()"
    [style.--utilization-filters-width]="filtersWidth"
    [style.--utilization-strip-width]="stripWidth">
    @if (rightPanelVisible() && isFiltersCollapsed()) {
      <button
        type="button"
        class="utilization-tab__backdrop"
        aria-label="Close filters"
        (click)="closeFiltersPanel()"></button>
    }

    <div class="utilization-tab__main">
      <ngui-typography type="h3">{{ title() }}</ngui-typography>
      <ngui-typography type="ui-small" class="utilization-tab__main-hint">
        {{ description() }}
      </ngui-typography>

      <app-utilization-content
        class="utilization-tab__content"
        [title]="title()"
        [description]="description()">
        @if (tabId() === 'tiered-plan-highlights') {
          <app-funnel-chart [chart]="tieredMembershipChart" />
        }
      </app-utilization-content>
    </div>

    <app-utilization-filters
      [tabId]="tabId()"
      [visible]="rightPanelVisible()"
      [isCollapsed]="isFiltersCollapsed()"
      [isNarrow]="isNarrow()"
      [timeline]="timeline()"
      [filterValues]="filterValues()"
      (visibleChange)="onRightPanelVisibleChange($event)"
      (timelineChange)="timeline.set($event)"
      (filterValuesChange)="filterValues.set($event)" />
  </div>
</section>
