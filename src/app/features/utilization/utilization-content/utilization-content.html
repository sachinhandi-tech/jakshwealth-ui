<div class="utilization-content" aria-label="Utilization dashboard content">
  @if (loading()) {
    <ngui-typography type="ui-small" class="utilization-content__status">
      Loading dashboard…
    </ngui-typography>
  } @else if (error()) {
    <ngui-typography type="ui-small" class="utilization-content__status utilization-content__status--error">
      {{ error() }}
    </ngui-typography>
  } @else {
    <ng-content />
  }
</div>
