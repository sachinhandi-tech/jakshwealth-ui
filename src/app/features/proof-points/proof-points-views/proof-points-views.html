<aside
  class="proof-points-views__panel"
  [class.proof-points-views__panel--narrow]="isCollapsed()"
  [class.proof-points-views__panel--expanded]="isCollapsed() && visible()"
  aria-label="Proof point views">
  @if (isCollapsed()) {
    <button
      type="button"
      class="proof-points-views__strip-btn"
      [attr.aria-expanded]="visible()"
      aria-label="Toggle views menu"
      (click)="togglePanel()">
      <span class="proof-points-views__strip-label">Views</span>
    </button>
  }

  <div class="proof-points-views__body">
    @if (isCollapsed()) {
      <header class="proof-points-views__header">
        <span class="proof-points-views__title">Views</span>
        <button
          type="button"
          class="proof-points-views__close"
          aria-label="Close views menu"
          (click)="closePanel()">
          ×
        </button>
      </header>
    }

    <nav class="proof-points-views__nav" aria-label="Proof point view menu">
      @for (view of views(); track view.id) {
        <button
          type="button"
          class="proof-points-views__nav-item"
          [class.proof-points-views__nav-item--active]="view.id === activeViewId()"
          (click)="selectView(view.id)">
          @if (view.icon) {
            <ngui-icon [matIcon]="view.icon" [size]="20" />
          }
          <span class="proof-points-views__nav-label">{{ view.label }}</span>
        </button>
      }
    </nav>
  </div>
</aside>
