<section class="proof-points-tab">
  <div
    class="proof-points-tab__layout"
    [class.proof-points-tab__layout--narrow]="isNarrow()"
    [class.proof-points-tab__layout--views-collapsed]="isViewsCollapsed()"
    [class.proof-points-tab__layout--filters-collapsed]="isFiltersCollapsed()"
    [style.--proof-points-sidebar-width]="sidebarWidth"
    [style.--proof-points-strip-width]="stripWidth">
    @if (
      (leftPanelVisible() && isViewsCollapsed()) ||
      (rightPanelVisible() && isFiltersCollapsed())
    ) {
      <button
        type="button"
        class="proof-points-tab__backdrop"
        aria-label="Close panel"
        (click)="closeAllPanels()"></button>
    }

    <app-proof-points-views
      [views]="views()"
      [activeViewId]="activeViewId()"
      [visible]="leftPanelVisible()"
      [isCollapsed]="isViewsCollapsed()"
      [isNarrow]="isNarrow()"
      (visibleChange)="onLeftPanelVisibleChange($event)"
      (viewChange)="onViewChange($event)" />

    <div class="proof-points-tab__main">
      <app-proof-points-charts
        class="proof-points-tab__charts"
        [activeViewLabel]="activeViewLabel()"
        [charts]="charts()"
        [loading]="chartsLoading()"
        [error]="chartsError()" />
    </div>

    <app-proof-points-filters
      [visible]="rightPanelVisible()"
      [isCollapsed]="isFiltersCollapsed()"
      [isNarrow]="isNarrow()"
      [timeline]="timeline()"
      [filterValues]="filterValues()"
      (visibleChange)="onRightPanelVisibleChange($event)"
      (timelineChange)="timeline.set($event)"
      (filterValuesChange)="filterValues.set($event)" />
  </div>
</section>
