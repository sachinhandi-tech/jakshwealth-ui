<ngui-card
  variant="page-level"
  class="proof-point-chart-card"
  [class.proof-point-chart-card--doughnut]="isDoughnutHeaderLayout()"
  [borderHeader]="false"
  [borderFooter]="false">
  @if (isDoughnutHeaderLayout()) {
    <header class="proof-point-chart-card__header">
      <ngui-typography type="h3" class="proof-point-chart-card__heading">
        {{ chart().title }}
      </ngui-typography>
      @if (chart().subtitle) {
        <ngui-typography type="ui-small" class="proof-point-chart-card__subtitle">
          {{ chart().subtitle }}
        </ngui-typography>
      }
    </header>
  } @else {
    <ngui-typography type="ui-small" class="proof-point-chart-card__title">
      {{ chart().title }} — {{ activeViewLabel() }}
    </ngui-typography>
  }

  <div
    class="proof-point-chart-card__chart-wrap"
    [class.proof-point-chart-card__chart-wrap--legend-right]="legendOnRight()"
    [class.proof-point-chart-card__chart-wrap--legend-bottom]="!legendOnRight()"
    [class.proof-point-chart-card__chart-wrap--doughnut]="isDoughnutHeaderLayout()">
    <ngui-charts
      [type]="chart().type"
      [width]="presentation()?.width ?? '100%'"
      [height]="presentation()?.height ?? '100%'"
      [minWidth]="presentation()?.minWidth"
      [maxWidth]="presentation()?.maxWidth"
      [minHeight]="presentation()?.minHeight"
      [maxHeight]="presentation()?.maxHeight"
      [data]="chart().data"
      [options]="chart().options"
      [plugins]="chart().plugins"
      [ariaLabel]="chart().ariaLabel" />
  </div>
</ngui-card>
