<aside
  class="proof-points-filters__panel"
  [class.proof-points-filters__panel--narrow]="isCollapsed()"
  [class.proof-points-filters__panel--expanded]="isCollapsed() && visible()"
  aria-label="Proof point filters">
  @if (isCollapsed()) {
    <button
      type="button"
      class="proof-points-filters__strip-btn"
      [attr.aria-expanded]="visible()"
      aria-label="Toggle filters"
      (click)="togglePanel()">
      <span class="proof-points-filters__strip-label">Filters</span>
    </button>
  }

  <div class="proof-points-filters__body">
    @if (isCollapsed()) {
      <header class="proof-points-filters__header">
        <span class="proof-points-filters__title">Filters</span>
        <button
          type="button"
          class="proof-points-filters__close"
          aria-label="Close filters"
          (click)="closePanel()">
          ×
        </button>
      </header>
    } @else {
      <header class="proof-points-filters__header proof-points-filters__header--desktop">
        <span class="proof-points-filters__title">Filters</span>
      </header>
    }

    <div class="proof-points-filters">
      <div class="proof-points-filters__timeline">
        <ngui-typography type="ui-small" class="proof-points-filters__section-label">
          Timeline
        </ngui-typography>

        <ngui-chips
          type="single-select"
          size="md"
          [selected]="timeline()"
          (selectedChange)="onTimelineChange($event)">
          <ngui-chip label="YTD" value="ytd" />
          <ngui-chip label="YoY" value="yoy" />
        </ngui-chips>
      </div>

      @for (filter of filters; track filter.key) {
        <ngui-dropdown
          class="proof-points-filters__dropdown"
          [label]="filter.label"
          [options]="filter.options"
          [multiSelect]="filter.multiSelect"
          [multiSelectAllOption]="filter.multiSelect"
          [filter]="filter.options.length > 8"
          [showClear]="true"
          placeholder="Select..."
          width="100%"
          [ngModel]="filterValues()[filter.key]"
          (ngModelChange)="onFilterChange(filter.key, $event)" />
      }
    </div>
  </div>
</aside>
