<button
  type="button"
  class="nav-card"
  [class]="'nav-card nav-card--' + (card().accent ?? 'cyan')"
  (click)="onCardClick()">
  @if (card().badge) {
    <span class="nav-card__badge">{{ card().badge }}</span>
  }

  <span class="nav-card__icon" aria-hidden="true">{{ iconEmoji() }}</span>

  <h3 class="nav-card__title">{{ card().title }}</h3>
  <p class="nav-card__desc">{{ card().description }}</p>

  <span class="nav-card__action">
    {{ card().actionLabel }}
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
</button>
